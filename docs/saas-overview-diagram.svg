<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b1915; font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112620" />
      <stop offset="50%" stop-color="#0a1714" />
      <stop offset="100%" stop-color="#060e0c" />
    </linearGradient>
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#0d281e" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGlow)"/>

  <!-- Decorative Grid & Glow -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <path d="M0,80 L1200,80 M0,160 L1200,160 M0,240 L1200,240 M0,320 L1200,320 M0,400 L1200,400 M0,480 L1200,480 M0,560 L1200,560 M0,640 L1200,640" />
    <path d="M120,0 L120,680 M240,0 L240,680 M360,0 L360,680 M480,0 L480,680 M600,0 L600,680 M720,0 L720,680 M840,0 L840,680 M960,0 L960,680 M1080,0 L1080,680" />
  </g>

  <!-- Top Hero Header -->
  <g transform="translate(60, 45)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#1b4332" stroke="#2d6a4f" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#10b981"/>
    <text x="24" y="17" fill="#6ee7b7" font-size="11" font-weight="600" letter-spacing="1">CLINICAL SAAS PLATFORM</text>

    <!-- Main Title -->
    <text x="0" y="58" fill="#ffffff" font-size="30" font-weight="700" letter-spacing="-0.5">Doctor Tracker</text>
    <text x="220" y="58" fill="#10b981" font-size="30" font-weight="300">|</text>
    <text x="235" y="58" fill="#94a3b8" font-size="20" font-weight="400">Next-Gen Hospital Workforce &amp; Caseload Intelligence</text>
    <text x="0" y="84" fill="#64748b" font-size="13">Eliminating spreadsheet drift, unbalanced patient loads, and blind handoffs across inpatient care.</text>
  </g>

  <!-- TOP BAR: Clinical Status Indicator Banner -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <rect width="1080" height="74" rx="10" fill="#112620" stroke="#1f3d34" stroke-width="1"/>
    <text x="24" y="28" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">CLINICAL WARD DISTRIBUTION BAR (LIVE DEMO STATUS)</text>
    
    <!-- Multi-Segment Color Bar -->
    <g transform="translate(24, 40)">
      <!-- Critical -->
      <rect x="0" y="0" width="130" height="14" rx="3" fill="#ef4444"/>
      <!-- Observation -->
      <rect x="135" y="0" width="190" height="14" rx="3" fill="#f59e0b"/>
      <!-- Recovering -->
      <rect x="330" y="0" width="220" height="14" rx="3" fill="#3b82f6"/>
      <!-- Stable -->
      <rect x="555" y="0" width="370" height="14" rx="3" fill="#10b981"/>
      <!-- Discharged -->
      <rect x="930" y="0" width="102" height="14" rx="3" fill="#64748b"/>
    </g>

    <!-- Labels below -->
    <g transform="translate(24, 64)" font-size="11" font-weight="500">
      <circle cx="4" cy="-4" r="3" fill="#ef4444"/>
      <text x="12" y="0" fill="#fca5a5">Critical (13%)</text>
      
      <circle cx="140" cy="-4" r="3" fill="#f59e0b"/>
      <text x="148" y="0" fill="#fde68a">Observation (18%)</text>
      
      <circle cx="335" cy="-4" r="3" fill="#3b82f6"/>
      <text x="343" y="0" fill="#93c5fd">Recovering (21%)</text>
      
      <circle cx="560" cy="-4" r="3" fill="#10b981"/>
      <text x="568" y="0" fill="#6ee7b7">Stable (36%)</text>
      
      <circle cx="935" cy="-4" r="3" fill="#64748b"/>
      <text x="943" y="0" fill="#cbd5e1">Discharged (12%)</text>
    </g>
  </g>

  <!-- THREE COLUMN CORE VALUE PILLARS -->
  
  <!-- Pillar 1: Role Scoping & Workflow -->
  <g transform="translate(60, 260)" filter="url(#cardShadow)">
    <rect width="340" height="260" rx="10" fill="#112620" stroke="#1f3d34" stroke-width="1"/>
    
    <rect x="20" y="20" width="36" height="36" rx="8" fill="#1b4332" stroke="#2d6a4f" stroke-width="1"/>
    <!-- Lock / Role Icon -->
    <path d="M34,34 L42,34 M38,30 L38,38 M33,35 C33,31 43,31 43,35" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <text x="68" y="36" fill="#ffffff" font-size="15" font-weight="600">Strict Role Scoping</text>
    <text x="68" y="52" fill="#6ee7b7" font-size="11">Admin · Doctor · Nurse</text>
    
    <line x1="20" y1="72" x2="320" y2="72" stroke="#1f3d34" stroke-width="1"/>

    <g transform="translate(20, 88)" font-size="12" fill="#cbd5e1">
      <text x="0" y="14" font-weight="600" fill="#e2e8f0">👑 Hospital Administrator</text>
      <text x="14" y="30" fill="#94a3b8" font-size="11">Full ward control, shifts &amp; staff accounts</text>

      <text x="0" y="58" font-weight="600" fill="#e2e8f0">🩺 Attending Physician</text>
      <text x="14" y="74" fill="#94a3b8" font-size="11">Strictly sandboxed to their own caseload</text>

      <text x="0" y="102" font-weight="600" fill="#e2e8f0">🩹 Floor Nurse</text>
      <text x="14" y="118" fill="#94a3b8" font-size="11">Live status, progress notes &amp; follow-ups</text>
    </g>

    <rect x="20" y="222" width="300" height="24" rx="6" fill="#0d281e" stroke="#1b4332" stroke-width="1"/>
    <text x="32" y="238" fill="#10b981" font-size="10" font-weight="600">ZERO UNAUTHORIZED CROSS-DOCTOR ACCESS</text>
  </g>

  <!-- Pillar 2: Clinical Operations -->
  <g transform="translate(430, 260)" filter="url(#cardShadow)">
    <rect width="340" height="260" rx="10" fill="#112620" stroke="#1f3d34" stroke-width="1"/>
    
    <rect x="20" y="20" width="36" height="36" rx="8" fill="#1e3a8a" stroke="#2563eb" stroke-width="1"/>
    <!-- Transfer / Shift Icon -->
    <path d="M30,38 L46,38 M41,33 L46,38 L41,43 M46,38" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <text x="68" y="36" fill="#ffffff" font-size="15" font-weight="600">Operational Intelligence</text>
    <text x="68" y="52" fill="#93c5fd" font-size="11">Capacity · Shifts · Transfers</text>
    
    <line x1="20" y1="72" x2="320" y2="72" stroke="#1f3d34" stroke-width="1"/>

    <g transform="translate(20, 88)" font-size="12" fill="#cbd5e1">
      <text x="0" y="14" font-weight="600" fill="#e2e8f0">⚖️ Caseload Capacity Balancer</text>
      <text x="14" y="30" fill="#94a3b8" font-size="11">Real-time alerts before physicians overload</text>

      <text x="0" y="58" font-weight="600" fill="#e2e8f0">🔄 Safe Caseload Transfers</text>
      <text x="14" y="74" fill="#94a3b8" font-size="11">Mandatory reason logging in patient history</text>

      <text x="0" y="102" font-weight="600" fill="#e2e8f0">📅 Clash-Proof Duty Shifts</text>
      <text x="14" y="118" fill="#94a3b8" font-size="11">Automatic detection of overlapping schedules</text>
    </g>

    <rect x="20" y="222" width="300" height="24" rx="6" fill="#172554" stroke="#1e3a8a" stroke-width="1"/>
    <text x="32" y="238" fill="#60a5fa" font-size="10" font-weight="600">FULL CLINICAL AUDIT TRAILS ON EVERY STEP</text>
  </g>

  <!-- Pillar 3: Security & Engineering Architecture -->
  <g transform="translate(800, 260)" filter="url(#cardShadow)">
    <rect width="340" height="260" rx="10" fill="#112620" stroke="#1f3d34" stroke-width="1"/>
    
    <rect x="20" y="20" width="36" height="36" rx="8" fill="#4c1d95" stroke="#7c3aed" stroke-width="1"/>
    <!-- Shield Icon -->
    <path d="M38,28 L46,31 L46,39 C46,45 38,49 38,49 C38,49 30,45 30,39 L30,31 Z" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linejoin="round"/>
    
    <text x="68" y="36" fill="#ffffff" font-size="15" font-weight="600">Enterprise Security</text>
    <text x="68" y="52" fill="#c4b5fd" font-size="11">HIPAA &amp; Zero-PHI Architecture</text>
    
    <line x1="20" y1="72" x2="320" y2="72" stroke="#1f3d34" stroke-width="1"/>

    <g transform="translate(20, 88)" font-size="12" fill="#cbd5e1">
      <text x="0" y="14" font-weight="600" fill="#e2e8f0">🔒 Zero-PHI Logging</text>
      <text x="14" y="30" fill="#94a3b8" font-size="11">Protected health data stripped from all logs</text>

      <text x="0" y="58" font-weight="600" fill="#e2e8f0">🛡️ Atomic Audited Mutations</text>
      <text x="14" y="74" fill="#94a3b8" font-size="11">MongoDB transactions roll back on audit fail</text>

      <text x="0" y="102" font-weight="600" fill="#e2e8f0">⚡ Distributed Rate Limiting</text>
      <text x="14" y="118" fill="#94a3b8" font-size="11">Serverless-persistent MongoDB TTL counters</text>
    </g>

    <rect x="20" y="222" width="300" height="24" rx="6" fill="#2e1065" stroke="#4c1d95" stroke-width="1"/>
    <text x="32" y="238" fill="#a78bfa" font-size="10" font-weight="600">10 SECURITY AUDIT REMEDIATIONS APPLIED</text>
  </g>

  <!-- BOTTOM STATS BANNER -->
  <g transform="translate(60, 545)" filter="url(#cardShadow)">
    <rect width="1080" height="85" rx="10" fill="#0d281e" stroke="#1b4332" stroke-width="1"/>
    
    <g transform="translate(35, 22)">
      <text x="0" y="26" fill="#10b981" font-size="28" font-weight="700">49/49</text>
      <text x="0" y="44" fill="#94a3b8" font-size="11">Backend Tests Passing</text>
    </g>

    <line x1="220" y1="18" x2="220" y2="68" stroke="#1f3d34" stroke-width="1"/>

    <g transform="translate(255, 22)">
      <text x="0" y="26" fill="#10b981" font-size="28" font-weight="700">85/85</text>
      <text x="0" y="44" fill="#94a3b8" font-size="11">Browser QA Checks</text>
    </g>

    <line x1="440" y1="18" x2="440" y2="68" stroke="#1f3d34" stroke-width="1"/>

    <g transform="translate(475, 22)">
      <text x="0" y="26" fill="#10b981" font-size="28" font-weight="700">100%</text>
      <text x="0" y="44" fill="#94a3b8" font-size="11">Responsive (320px–1920px)</text>
    </g>

    <line x1="680" y1="18" x2="680" y2="68" stroke="#1f3d34" stroke-width="1"/>

    <g transform="translate(715, 22)">
      <text x="0" y="26" fill="#38bdf8" font-size="28" font-weight="700">Next.js 16</text>
      <text x="0" y="44" fill="#94a3b8" font-size="11">React 19 + Turbopack</text>
    </g>

    <line x1="880" y1="18" x2="880" y2="68" stroke="#1f3d34" stroke-width="1"/>

    <g transform="translate(915, 22)">
      <text x="0" y="26" fill="#f59e0b" font-size="28" font-weight="700">LIVE</text>
      <text x="0" y="44" fill="#94a3b8" font-size="11">Deployed on Vercel</text>
    </g>
  </g>
</svg>
